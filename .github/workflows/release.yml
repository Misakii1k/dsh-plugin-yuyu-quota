name: Release

# 推一个 v* tag 就自动出包并发布，随后提示部署 Cloudflare Pages。
# 所需仓库 Secrets：
#   CLOUDFLARE_API_TOKEN   —— 可选，配置后自动部署 Pages（需要 Pages:Edit + Account 读权限）
#   CLOUDFLARE_ACCOUNT_ID  —— 可选，同上

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag（例如 v1.1.0）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Smoke test
        run: |
          node scripts/build.mjs
          node scripts/smoke-test.mjs

      - name: Pack
        run: node scripts/pack.mjs

      - name: Generate version manifest
        run: node scripts/gen-version.mjs --release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "发布 ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，跳过创建（仅补传资产）"
          else
            NOTES_FILE="docs/releases/${VERSION}.md"
            if [ -f "$NOTES_FILE" ]; then
              gh release create "${TAG}" --title "${TAG}" --notes-file "$NOTES_FILE"
            else
              gh release create "${TAG}" --title "${TAG}" --generate-notes
            fi
          fi

          gh release upload "${TAG}" "dsh-plugin-yuyu-quota-${VERSION}.tgz" --clobber
          gh release upload "${TAG}" "public/version.json" --clobber

      - name: Deploy Cloudflare Pages (optional)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy public \
            --project-name dsh-plugin-yuyu-quota-update \
            --commit-dirty=true
