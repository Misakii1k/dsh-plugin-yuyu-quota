<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>灵动卡片折展 (Modern Glass & Drawer)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 80% 20%, #e0f2fe 0%, #f8fafc 60%, #f1f5f9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      color: #1e293b;
    }
    .glass-card {
      width: 348px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.03);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
    }
    .brand-text h3 {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
    }
    .brand-text span {
      font-size: 10px;
      color: #64748b;
    }

    /* 账号头像徽章横向流 */
    .avatars-row {
      display: flex;
      gap: 6px;
    }
    .avatar-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 4px;
      border-radius: 20px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.18s;
    }
    .avatar-chip.active {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }
    .avatar-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #cbd5e1;
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-chip.active .avatar-circle {
      background: #3b82f6;
    }
    .chip-name {
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 极简资产巨幕 */
    .asset-stage {
      text-align: center;
      padding: 10px 0 6px 0;
    }
    .stage-label {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.2px;
    }
    .stage-amount {
      font-size: 34px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -1px;
      margin: 2px 0;
      font-variant-numeric: tabular-nums;
    }
    .stage-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      font-size: 10.5px;
      padding: 2px 9px;
      border-radius: 12px;
      font-weight: 500;
    }

    /* 灵动抽屉折叠板 */
    .drawer-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
    }
    .drawer-content {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      border-top: 1px dashed #e2e8f0;
      padding-top: 8px;
    }
    .drawer-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .drawer-item .label {
      font-size: 9.5px;
      color: #64748b;
    }
    .drawer-item .val {
      font-size: 11.5px;
      font-weight: 700;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    /* 气泡式操作栏 */
    .btn-action-bubble {
      width: 100%;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 0;
      font-size: 11.5px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: all 0.15s;
    }
    .btn-action-bubble:hover {
      border-color: #3b82f6;
      color: #1d4ed8;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.12);
    }
    .glass-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="card-top">
      <div class="brand-group">
        <div class="brand-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12V7H4a2 2 0 0 1 0-4h16v4"/><path d="M2 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M17 12a2 2 0 0 0 0 4h4v-4Z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h3>鱼鱼资产</h3>
          <span>自动感应</span>
        </div>
      </div>

      <!-- 快速账号微头像胶囊 -->
      <div class="avatars-row">
        <div class="avatar-chip active" title="878503820@qq.com ($7.02)">
          <span class="avatar-circle">87</span>
          <span class="chip-name">$7.02</span>
        </div>
        <div class="avatar-chip" title="3231640018@qq.com ($8.81)">
          <span class="avatar-circle">32</span>
          <span class="chip-name">$8.81</span>
        </div>
      </div>
    </div>

    <!-- 资产大字聚焦 -->
    <div class="asset-stage">
      <div class="stage-label">实时可用资产额度</div>
      <div class="stage-amount">$7.02</div>
      <div class="stage-pill">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <span>已充值 $13.90 · 额度充裕</span>
      </div>
    </div>

    <!-- 灵动抽屉折展详情 -->
    <div class="drawer-card">
      <div class="drawer-toggle">
        <span>今日用量与安全指标</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <div class="drawer-content">
        <div class="drawer-item">
          <span class="label">今日扣费</span>
          <span class="val">$0.0000</span>
        </div>
        <div class="drawer-item">
          <span class="label">消耗Tokens</span>
          <span class="val">0</span>
        </div>
        <div class="drawer-item">
          <span class="label">活跃密钥</span>
          <span class="val">2 个</span>
        </div>
      </div>
    </div>

    <button class="btn-action-bubble">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>同步浏览器登录账号</span>
    </button>

    <div class="glass-footer">
      <span>同步: 22:35:10</span>
      <span>0ms 本地磁盘直提</span>
    </div>
  </div>
</body>
</html>
