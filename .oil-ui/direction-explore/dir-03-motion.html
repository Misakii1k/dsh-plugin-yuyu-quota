<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>鱼鱼 API 灵动折展 (极佳优雅动效版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 80% 20%, #e0f2fe 0%, #f8fafc 60%, #f1f5f9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      color: #0f172a;
      overflow: hidden;
    }

    /* 优雅缓动与关键帧定义 */
    @keyframes yuyuNumPop {
      0% { transform: translateY(4px) scale(0.97); opacity: 0.6; }
      60% { transform: translateY(-1px) scale(1.01); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes yuyuGlow {
      0%, 100% { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12); }
      50% { box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.22); }
    }

    .glass-card {
      width: 348px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      box-shadow: 0 16px 36px -4px rgba(15, 23, 42, 0.1), 0 4px 14px rgba(15, 23, 42, 0.03);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform-origin: bottom right;
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2563eb;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .brand-group:hover .brand-icon {
      transform: scale(1.08) rotate(-4deg);
    }
    .brand-text {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.2px;
    }

    /* 账号头像胶囊流 */
    .avatars-row {
      display: flex;
      gap: 5px;
    }
    .avatar-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px 3px 4px;
      border-radius: 20px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      font-size: 11px;
      color: #475569;
      user-select: none;
      transition: transform 0.12s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }
    .avatar-chip:hover {
      background: #e8ebf0;
      transform: translateY(-1px);
    }
    .avatar-chip:active {
      transform: scale(0.93);
    }
    .avatar-chip.active {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
      animation: yuyuGlow 2.5s infinite ease-in-out;
    }
    .avatar-circle {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #94a3b8;
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    .avatar-chip.active .avatar-circle {
      background: #2563eb;
    }
    .chip-name {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    /* 资产大字聚焦（主角） */
    .asset-stage {
      text-align: center;
      padding: 6px 0 2px 0;
    }
    .stage-label {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 2px;
      transition: color 0.18s;
    }
    .stage-amount {
      font-size: 34px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      display: inline-block;
      transition: color 0.2s ease;
    }
    .stage-amount.is-animating {
      animation: yuyuNumPop 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .stage-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      font-size: 10.5px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      margin-top: 5px;
      font-variant-numeric: tabular-nums;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .stage-pill:hover {
      transform: scale(1.02);
    }

    /* 抽屉折叠板：平滑高度渐变 */
    .drawer-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.18s;
    }
    .drawer-card:hover {
      border-color: #cbd5e1;
    }
    .drawer-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s ease;
    }
    .drawer-toggle:hover {
      color: #0f172a;
    }
    .drawer-arrow {
      display: inline-flex;
      color: #64748b;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .drawer-arrow.collapsed {
      transform: rotate(-90deg);
    }

    /* 关键：抽屉折叠展开的极致丝滑 */
    .drawer-content {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      overflow: hidden;
      max-height: 80px;
      opacity: 1;
      padding-top: 8px;
      margin-top: 8px;
      border-top: 1px dashed #e2e8f0;
      transition: max-height 0.26s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, margin 0.22s ease, padding 0.22s ease;
    }
    .drawer-content.collapsed {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      margin-top: 0;
      border-top-color: transparent;
      pointer-events: none;
    }

    .drawer-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .drawer-item .label {
      font-size: 10px;
      color: #64748b;
    }
    .drawer-item .val {
      font-size: 12px;
      font-weight: 600;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
      transition: transform 0.2s;
    }

    /* 动作按钮 */
    .btn-action {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 0;
      font-size: 11.5px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-action:hover {
      border-color: #2563eb;
      color: #1d4ed8;
      background: #f8fafc;
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.08);
    }
    .btn-action:active {
      transform: scale(0.97);
    }

    /* 刷新按钮 */
    .btn-icon {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      padding: 4px;
      color: #64748b;
      display: inline-flex;
      border-radius: 5px;
      transition: all 0.16s ease;
    }
    .btn-icon:hover {
      color: #0f172a;
      background: #f1f5f9;
      transform: scale(1.05);
    }
    .btn-icon:active {
      transform: scale(0.92);
    }

    /* 提示消息平滑淡出 */
    .sync-tip {
      font-size: 10.5px;
      text-align: center;
      padding: 4px 6px;
      border-radius: 5px;
      background: #f0fdf4;
      color: #059669;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(4px);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sync-tip.show {
      max-height: 36px;
      opacity: 1;
      transform: translateY(0);
      margin-top: 6px;
    }

    /* 底部状态 */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #94a3b8;
      padding-top: 2px;
      border-top: 1px solid #f8fafc;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #10b981;
      font-weight: 500;
    }
    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="card-top">
      <div class="brand-group">
        <div class="brand-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12V7H4a2 2 0 0 1 0-4h16v4"/><path d="M2 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M17 12a2 2 0 0 0 0 4h4v-4Z"/>
          </svg>
        </div>
        <span class="brand-text">鱼鱼 API</span>
      </div>

      <div style="display:flex;align-items:center;gap:6px;">
        <div class="avatars-row">
          <div class="avatar-chip active" id="chip-1">
            <span class="avatar-circle">87</span>
            <span class="chip-name">$7.02</span>
          </div>
          <div class="avatar-chip" id="chip-2">
            <span class="avatar-circle">32</span>
            <span class="chip-name">$8.81</span>
          </div>
        </div>
        <button class="btn-icon" id="btn-refresh" title="刷新数据">
          <svg id="svg-refresh" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 资产大字聚焦 -->
    <div class="asset-stage">
      <div class="stage-label">可用余额</div>
      <div class="stage-amount" id="main-amount">$7.02</div>
      <div>
        <div class="stage-pill" id="main-recharge">累计充值 $13.90</div>
      </div>
    </div>

    <!-- 抽屉折叠板 -->
    <div class="drawer-card">
      <div class="drawer-toggle" id="drawer-toggle">
        <span>今日用量</span>
        <span class="drawer-arrow" id="drawer-arrow">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </span>
      </div>
      <div class="drawer-content" id="drawer-content">
        <div class="drawer-item">
          <span class="label">实扣</span>
          <span class="val" id="val-cost">$0.0000</span>
        </div>
        <div class="drawer-item">
          <span class="label">Tokens</span>
          <span class="val" id="val-tokens">0</span>
        </div>
        <div class="drawer-item">
          <span class="label">密钥</span>
          <span class="val" id="val-keys">2 个</span>
        </div>
      </div>
    </div>

    <!-- 核心动作 -->
    <button class="btn-action" id="btn-sync">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2"/><path d="M2 8h20"/><circle cx="6" cy="6" r=".5" fill="currentColor"/>
      </svg>
      <span id="sync-text">从浏览器同步账号</span>
    </button>

    <div class="sync-tip" id="sync-tip">已同步账号数据</div>

    <div class="card-footer">
      <span id="sync-time">已同步 22:35:10</span>
      <span class="status-badge">
        <span class="status-dot"></span>
        <span>本地直连</span>
      </span>
    </div>
  </div>

  <script>
    // 抽屉平滑折叠交互
    var drawerToggle = document.getElementById('drawer-toggle');
    var drawerContent = document.getElementById('drawer-content');
    var drawerArrow = document.getElementById('drawer-arrow');
    var isDrawerOpen = true;

    drawerToggle.addEventListener('click', function() {
      isDrawerOpen = !isDrawerOpen;
      if (isDrawerOpen) {
        drawerContent.classList.remove('collapsed');
        drawerArrow.classList.remove('collapsed');
      } else {
        drawerContent.classList.add('collapsed');
        drawerArrow.classList.add('collapsed');
      }
    });

    // 账号切换数字平滑呼吸动效
    var chip1 = document.getElementById('chip-1');
    var chip2 = document.getElementById('chip-2');
    var amountEl = document.getElementById('main-amount');
    var rechargeEl = document.getElementById('main-recharge');
    var costEl = document.getElementById('val-cost');
    var tokensEl = document.getElementById('val-tokens');
    var keysEl = document.getElementById('val-keys');

    function animateNumberSwitch(amount, recharge, cost, tokens, keys) {
      amountEl.classList.remove('is-animating');
      void amountEl.offsetWidth; // 触发 reflow
      amountEl.textContent = amount;
      rechargeEl.textContent = recharge;
      costEl.textContent = cost;
      tokensEl.textContent = tokens;
      keysEl.textContent = keys;
      amountEl.classList.add('is-animating');
    }

    chip1.addEventListener('click', function() {
      chip1.classList.add('active');
      chip2.classList.remove('active');
      animateNumberSwitch('$7.02', '累计充值 $13.90', '$0.0000', '0', '2 个');
    });

    chip2.addEventListener('click', function() {
      chip2.classList.add('active');
      chip1.classList.remove('active');
      animateNumberSwitch('$8.81', '累计充值 $48.00', '$0.0038', '32,444', '4 个');
    });

    // 刷新按钮弹性贝塞尔旋转
    var refreshBtn = document.getElementById('btn-refresh');
    var refreshSvg = document.getElementById('svg-refresh');
    refreshBtn.addEventListener('click', function() {
      refreshSvg.style.transition = 'transform 0.65s cubic-bezier(0.34, 1.3, 0.64, 1)';
      refreshSvg.style.transform = 'rotate(360deg)';
      setTimeout(function() {
        refreshSvg.style.transition = 'none';
        refreshSvg.style.transform = 'none';
      }, 650);
    });

    // 提示栏平滑滑入滑出
    var tip = document.getElementById('sync-tip');
    function showTip(text) {
      tip.textContent = text;
      tip.classList.add('show');
      setTimeout(function() {
        tip.classList.remove('show');
      }, 2500);
    }
  </script>
</body>
</html>
