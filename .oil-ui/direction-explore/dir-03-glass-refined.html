<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>鱼鱼 API 资产概况 (灵动卡片折展 - 减法精修版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 80% 20%, #e0f2fe 0%, #f8fafc 60%, #f1f5f9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      color: #0f172a;
    }
    .glass-card {
      width: 348px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.03);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2563eb;
    }
    .brand-text {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.2px;
    }

    /* 账号头像胶囊流 */
    .avatars-row {
      display: flex;
      gap: 5px;
    }
    .avatar-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px 3px 4px;
      border-radius: 20px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.16s ease;
      color: #475569;
    }
    .avatar-chip.active {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }
    .avatar-circle {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #94a3b8;
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-chip.active .avatar-circle {
      background: #2563eb;
    }
    .chip-name {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    /* 资产大字聚焦（主角） */
    .asset-stage {
      text-align: center;
      padding: 6px 0 2px 0;
    }
    .stage-label {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 2px;
    }
    .stage-amount {
      font-size: 34px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .stage-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      font-size: 10.5px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* 抽屉折叠板 */
    .drawer-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
    }
    .drawer-content {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      border-top: 1px dashed #e2e8f0;
      padding-top: 8px;
    }
    .drawer-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .drawer-item .label {
      font-size: 10px;
      color: #64748b;
    }
    .drawer-item .val {
      font-size: 12px;
      font-weight: 600;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    /* 动作按钮 */
    .btn-action {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 0;
      font-size: 11.5px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      border-color: #2563eb;
      color: #1d4ed8;
      background: #f8fafc;
    }

    /* 底部信息 */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #94a3b8;
      padding-top: 2px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #10b981;
      font-weight: 500;
    }
    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #10b981;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="card-top">
      <div class="brand-group">
        <div class="brand-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12V7H4a2 2 0 0 1 0-4h16v4"/><path d="M2 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M17 12a2 2 0 0 0 0 4h4v-4Z"/>
          </svg>
        </div>
        <span class="brand-text">鱼鱼 API</span>
      </div>

      <!-- 账号头像胶囊流 -->
      <div class="avatars-row">
        <div class="avatar-chip active" title="878503820@qq.com ($7.02)">
          <span class="avatar-circle">87</span>
          <span class="chip-name">$7.02</span>
        </div>
        <div class="avatar-chip" title="3231640018@qq.com ($8.81)">
          <span class="avatar-circle">32</span>
          <span class="chip-name">$8.81</span>
        </div>
      </div>
    </div>

    <!-- 资产大字聚焦 -->
    <div class="asset-stage">
      <div class="stage-label">可用余额</div>
      <div class="stage-amount">$7.02</div>
      <div class="stage-pill">
        <span>累计充值 $13.90</span>
      </div>
    </div>

    <!-- 抽屉折叠板 -->
    <div class="drawer-card">
      <div class="drawer-toggle">
        <span>今日用量</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <div class="drawer-content">
        <div class="drawer-item">
          <span class="label">实扣</span>
          <span class="val">$0.0000</span>
        </div>
        <div class="drawer-item">
          <span class="label">Tokens</span>
          <span class="val">0</span>
        </div>
        <div class="drawer-item">
          <span class="label">密钥</span>
          <span class="val">2 个</span>
        </div>
      </div>
    </div>

    <!-- 核心动作 -->
    <button class="btn-action">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2"/><path d="M2 8h20"/><circle cx="6" cy="6" r=".5" fill="currentColor"/>
      </svg>
      <span>从浏览器同步账号</span>
    </button>

    <div class="card-footer">
      <span>已同步 22:35:10</span>
      <span class="status-badge">
        <span class="status-dot"></span>
        <span>本地直连</span>
      </span>
    </div>
  </div>
</body>
</html>
