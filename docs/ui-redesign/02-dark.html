<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 B · 深色仪表盘</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #11171f;
    --raise: #182029;
    --line: #232e3a;
    --text: #e8edf4;
    --text-2: #9dabbd;
    --muted: #8d9cb0;
    --mint: #3ddc97;
    --mint-dim: rgba(61, 220, 151, .12);
    --blue: #4c9aff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #171d26;
    background-image:
      radial-gradient(circle at 82% 82%, rgba(61, 220, 151, .07), transparent 46%),
      radial-gradient(circle at 18% 10%, rgba(76, 154, 255, .06), transparent 40%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .frame { position: relative; width: 780px; height: 600px; overflow: hidden; }

  /* 挂件 */
  .widget { position: absolute; right: 26px; bottom: 22px; width: 118px; height: 118px; }
  .widget img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .55));
  }
  .widget .menu {
    position: absolute; top: -2px; right: -8px;
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--raise); color: var(--text-2);
    border: 1px solid var(--line);
  }

  /* 卡片 */
  .card {
    position: absolute;
    right: 26px; bottom: 120px;
    width: 396px;
    max-width: calc(100vw - 40px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 26px 52px -16px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .02) inset;
    overflow: hidden;
  }

  .head {
    display: flex; align-items: center; gap: 9px;
    padding: 12px 14px 0;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(150deg, #2c3d52, #1b2632);
    border: 1px solid #33465c;
    color: var(--text); display: grid; place-items: center;
    font-size: 11px; font-weight: 700; letter-spacing: .4px; flex-shrink: 0;
  }
  .who { flex: 1; min-width: 0; }
  .who .mail { font-size: 12.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .state { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px rgba(61, 220, 151, .14); flex-shrink: 0; }
  .switcher { display: flex; gap: 4px; }
  .sw {
    min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px;
    display: grid; place-items: center;
    background: var(--raise); border: 1px solid var(--line);
    font-size: 10px; font-weight: 700; color: var(--text-2); letter-spacing: .3px;
  }
  .sw.on { background: rgba(76, 154, 255, .16); border-color: rgba(76, 154, 255, .5); color: #9cc4ff; }

  /* 仪表 */
  .gauge { padding: 14px 16px 12px; }
  .gauge .cap { display: flex; align-items: baseline; justify-content: space-between; }
  .gauge .cap .k { font-size: 11.5px; color: var(--muted); letter-spacing: .4px; }
  .gauge .cap .since { font-size: 11px; color: var(--muted); }
  .amount {
    font-size: 40px; font-weight: 750; letter-spacing: -1.6px; line-height: 1.05;
    margin-top: 2px; display: flex; align-items: baseline; gap: 2px;
  }
  .amount .cur { font-size: 21px; font-weight: 650; color: var(--text-2); letter-spacing: 0; }
  .amount .frac { font-size: 24px; color: var(--text-2); font-weight: 650; letter-spacing: -.5px; }

  /* 余额条 */
  .bar { margin-top: 10px; }
  .bar .track {
    height: 6px; border-radius: 3px; background: #1d2836;
    overflow: hidden; position: relative;
  }
  .bar .fill {
    position: absolute; inset: 0; width: 26%;
    background: linear-gradient(90deg, #27a874, var(--mint));
    border-radius: 3px;
    box-shadow: 0 0 12px rgba(61, 220, 151, .45);
  }
  .bar .ticks { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; color: var(--muted); }
  .bar .ticks b { color: var(--text-2); font-weight: 600; }

  /* 今日 */
  .today {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, .012);
  }
  .cell { padding: 9px 14px; }
  .cell + .cell { border-left: 1px solid var(--line); }
  .cell .k { font-size: 11.5px; color: var(--muted); }
  .cell .v { font-size: 15px; font-weight: 700; margin-top: 2px; letter-spacing: -.2px; }
  .cell .v.mint { color: var(--mint); }

  /* 本轮 */
  .turn { padding: 11px 16px 13px; }
  .turn-head { display: flex; align-items: center; justify-content: space-between; }
  .turn-head .t { font-size: 12px; font-weight: 650; color: var(--text-2); letter-spacing: .2px; }
  .turn-head .m { font-size: 11px; color: var(--muted); }
  .turn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 7px; }
  .box {
    background: var(--raise); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 10px;
  }
  .box .k { font-size: 11px; color: var(--muted); }
  .box .v { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
  .box .v.mint { color: var(--mint); }
  .box .v .unit { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; letter-spacing: 0; }

  /* 脚 */
  .foot {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px 12px;
    border-top: 1px solid var(--line);
    background: #0e141b;
  }
  .cred { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); flex: 1; min-width: 0; }
  .cred .sq { width: 5px; height: 5px; border-radius: 1px; background: var(--mint); flex-shrink: 0; }
  .act {
    height: 28px; padding: 0 11px; border-radius: 7px;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 650; white-space: nowrap;
  }
  .act.primary { background: var(--mint); color: #04140c; }
  .act.ghost { background: var(--raise); border: 1px solid var(--line); color: var(--text-2); }
  svg { display: block; }
</style>
</head>
<body>
<div class="frame">

  <div class="card">
    <div class="head">
      <div class="avatar">87</div>
      <div class="who">
        <div class="mail">user@example.com</div>
        <div class="state"><span class="dot"></span>已连接 · 17:42:08</div>
      </div>
      <div class="switcher">
        <div class="sw on">87</div>
        <div class="sw">WL</div>
      </div>
    </div>

    <div class="gauge">
      <div class="cap"><span class="k">可用余额</span><span class="since">17:42:08 同步</span></div>
      <div class="amount"><span class="cur">$</span>12<span class="frac">.34</span></div>
      <div class="bar">
        <div class="track"><div class="fill"></div></div>
        <div class="ticks"><span>已充值 <b>$48.00</b></span><span>剩余 <b>25.7%</b></span></div>
      </div>
    </div>

    <div class="today">
      <div class="cell"><div class="k">今日实扣</div><div class="v mint">$0.4217</div></div>
      <div class="cell"><div class="k">今日 Tokens</div><div class="v">1.28M</div></div>
      <div class="cell"><div class="k">密钥</div><div class="v">3</div></div>
    </div>

    <div class="turn">
      <div class="turn-head"><span class="t">本轮用量</span><span class="m">deepseek-v4.1 · 17:41</span></div>
      <div class="turn-grid">
        <div class="box"><div class="k">Tokens</div><div class="v">128.4<span class="unit">K</span></div></div>
        <div class="box"><div class="k">实扣</div><div class="v mint">$0.0523</div></div>
        <div class="box"><div class="k">请求</div><div class="v">6<span class="unit">次</span></div></div>
        <div class="box"><div class="k">会话累计</div><div class="v">2.4<span class="unit">M</span></div></div>
      </div>
    </div>

    <div class="foot">
      <span class="cred"><span class="sq"></span>凭据自动续期 · 剩 6.2 小时</span>
      <span class="act primary">充值</span>
      <span class="act ghost">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20"/></svg>
        同步
      </span>
    </div>
  </div>

  <div class="widget">
    <img src="../../assets/DSniang1.png" alt="小鲸鱼">
    <div class="menu">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </div>
  </div>

</div>
</body>
</html>
