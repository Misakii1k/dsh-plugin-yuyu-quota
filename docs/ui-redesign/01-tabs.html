<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 A · 三档分页</title>
<style>
  :root {
    --ink: #0f172a;
    --ink-2: #334155;
    --muted: #52627a;
    --line: #e5ebf3;
    --line-soft: #eef2f7;
    --card: #ffffff;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --money: #047857;
    --money-soft: #eaf6f0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #eef2f7;
    background-image: radial-gradient(#d8e0ea 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .frame { position: relative; width: 780px; height: 600px; overflow: hidden; }

  /* 挂件 */
  .widget { position: absolute; right: 26px; bottom: 22px; width: 120px; height: 120px; }
  .widget img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 10px 18px rgba(15, 23, 42, .2));
  }
  .widget .menu {
    position: absolute; top: 0; right: -6px;
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center;
    background: #fff; color: var(--muted);
    border: 1px solid var(--line);
    box-shadow: 0 2px 6px rgba(15, 23, 42, .1);
  }

  /* 卡片 */
  .card {
    position: absolute;
    right: 26px; bottom: 122px;
    width: 392px;
    max-width: calc(100vw - 40px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 22px 44px -14px rgba(15, 23, 42, .24), 0 4px 12px rgba(15, 23, 42, .05);
    overflow: hidden;
  }
  .body { padding: 14px 16px 0; }

  .head { display: flex; align-items: center; gap: 9px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700; letter-spacing: .3px;
    flex-shrink: 0;
  }
  .who { flex: 1; min-width: 0; }
  .who .mail {
    font-size: 13px; font-weight: 650; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .who .state {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--muted); margin-top: 1px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; flex-shrink: 0; }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center;
    background: #fff; border: 1px solid var(--line); color: var(--ink-2);
    flex-shrink: 0;
  }

  /* 账号 */
  .accounts { display: flex; gap: 6px; margin-top: 10px; overflow: hidden; }
  .acct {
    display: flex; align-items: center; gap: 5px;
    padding: 3px 9px 3px 3px; border-radius: 999px;
    background: #f4f7fb; border: 1px solid var(--line);
    font-size: 12px; color: var(--ink-2); white-space: nowrap;
  }
  .acct .mini {
    width: 17px; height: 17px; border-radius: 50%;
    background: #566a86; color: #fff;
    display: grid; place-items: center; font-size: 9px; font-weight: 700;
  }
  .acct b { color: var(--ink); font-weight: 650; }
  .acct.on {
    background: var(--accent-soft); border-color: #b9cdff; color: #1d4ed8;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .07);
  }
  .acct.on .mini { background: var(--accent); }
  .acct.on b { color: #1d4ed8; }

  /* 余额 */
  .balance { display: flex; align-items: flex-end; gap: 10px; padding: 12px 0 0; }
  .balance .main { flex: 1; min-width: 0; }
  .balance .label { font-size: 12px; color: var(--muted); }
  .balance .amount {
    font-size: 42px; font-weight: 800; letter-spacing: -2px; line-height: 1.02;
  }
  .balance .amount .cur { font-size: 24px; font-weight: 700; letter-spacing: -.5px; color: var(--ink-2); margin-right: 1px; }
  .paid {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--money); background: var(--money-soft);
    border-radius: 999px; padding: 3px 9px; font-weight: 600; white-space: nowrap;
    margin-bottom: 5px;
  }

  /* 分页 */
  .tabs {
    display: flex; gap: 2px; padding: 3px; margin-top: 12px;
    background: var(--line-soft); border-radius: 10px;
  }
  .tab {
    flex: 1; text-align: center; padding: 5px 0;
    font-size: 12.5px; color: var(--muted); border-radius: 8px;
  }
  .tab.on { background: #fff; color: var(--ink); font-weight: 650; box-shadow: 0 1px 2px rgba(15, 23, 42, .1); }
  .tab .badge {
    display: inline-block; margin-left: 3px;
    width: 5px; height: 5px; border-radius: 50%; background: #f59e0b; vertical-align: 3px;
  }

  .panel { padding: 11px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .k { font-size: 12px; color: var(--muted); }
  .v { font-size: 16px; font-weight: 700; margin-top: 1px; letter-spacing: -.3px; }
  .v.money { color: var(--money); }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 12.5px;
  }
  .row .lbl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .row .val { font-weight: 650; color: var(--ink); }
  .row .val.money { color: var(--money); }

  /* 底部粘性操作 */
  .footer {
    padding: 10px 16px 12px; margin-top: 9px;
    border-top: 1px solid var(--line-soft); background: #fbfdff;
  }
  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; height: 32px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 12.5px; font-weight: 650;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink-2); }
  .meta {
    display: flex; justify-content: space-between;
    margin-top: 8px; font-size: 11.5px; color: #5d6b80;
  }
  svg { display: block; }
</style>
</head>
<body>
<div class="frame">

  <div class="card">
    <div class="body">
      <div class="head">
        <div class="avatar">87</div>
        <div class="who">
          <div class="mail">user@example.com</div>
          <div class="state"><span class="dot"></span>已连接 · 17:42:08 同步</div>
        </div>
        <div class="icon-btn" aria-label="刷新">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.8 9.8 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.7-2.7L3 16"/><path d="M8 16H3v5"/></svg>
        </div>
        <div class="icon-btn" aria-label="设置">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </div>
      </div>

      <div class="accounts">
        <div class="acct on"><span class="mini">87</span>user@example.com <b>$12.34</b></div>
        <div class="acct"><span class="mini">WL</span>whale.lab <b>$3.05</b></div>
      </div>

      <div class="balance">
        <div class="main">
          <div class="label">可用余额</div>
          <div class="amount"><span class="cur">$</span>12.34</div>
        </div>
        <span class="paid">累计充值 $48.00
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
        </span>
      </div>

      <div class="tabs">
        <div class="tab on">资产</div>
        <div class="tab">用量<span class="badge"></span></div>
        <div class="tab">偏好</div>
      </div>

      <div class="panel">
        <div class="stats">
          <div><div class="k">今日实扣</div><div class="v money">$0.4217</div></div>
          <div><div class="k">今日 Tokens</div><div class="v">1.28M</div></div>
          <div><div class="k">密钥</div><div class="v">3 个</div></div>
        </div>
        <div class="row">
          <span class="lbl"><span class="dot"></span>登录凭据</span>
          <span class="val">可自动续期 · 剩 6.2 小时</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="actions">
        <div class="btn primary">充值</div>
        <div class="btn ghost">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20"/><circle cx="6" cy="6" r=".6" fill="currentColor"/></svg>
          从浏览器同步
        </div>
      </div>
      <div class="meta"><span>今日 6 次请求 · 17:41 完成一轮</span><span>v1.2.0</span></div>
    </div>
  </div>

  <div class="widget">
    <img src="../../assets/DSniang1.png" alt="小鲸鱼">
    <div class="menu">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </div>
  </div>

</div>
</body>
</html>
