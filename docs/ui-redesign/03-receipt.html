<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 C · 横向票据</title>
<style>
  :root {
    --paper: #fdfcf9;
    --stub: #f4f1ea;
    --ink: #1c1a17;
    --ink-2: #4d4841;
    --muted: #6b6357;
    --rule: #e3ddd2;
    --stamp: #b4442e;
    --stamp-soft: #fbeee9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #ece7df;
    background-image:
      linear-gradient(#e2dbd0 1px, transparent 1px),
      linear-gradient(90deg, #e2dbd0 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .frame { position: relative; width: 780px; height: 600px; overflow: hidden; }

  /* 挂件 */
  .widget { position: absolute; right: 24px; bottom: 22px; width: 116px; height: 116px; }
  .widget img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 9px 16px rgba(28, 26, 23, .24));
  }
  .widget .menu {
    position: absolute; top: -2px; right: -8px;
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--paper); color: var(--muted);
    border: 1px solid var(--rule);
  }

  /* 票据卡片 */
  .card {
    position: absolute;
    right: 24px; bottom: 118px;
    width: 460px;
    max-width: calc(100vw - 40px);
    display: flex;
    filter: drop-shadow(0 20px 34px rgba(60, 50, 38, .22)) drop-shadow(0 3px 8px rgba(60, 50, 38, .1));
  }

  .main {
    flex: 1; min-width: 0;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-right: none;
    border-radius: 12px 0 0 12px;
    padding: 12px 14px 11px;
  }
  .stub {
    width: 116px; flex-shrink: 0;
    background: var(--stub);
    border: 1px solid var(--rule);
    border-left: 1px dashed #cfc6b8;
    border-radius: 0 12px 12px 0;
    padding: 12px 11px 11px;
    display: flex; flex-direction: column;
  }

  /* 顶部 */
  .head { display: flex; align-items: center; gap: 8px; }
  .brand {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; letter-spacing: .8px;
    color: var(--ink-2); text-transform: uppercase;
  }
  .brand svg { color: var(--stamp); }
  .head .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: #2f6b4f; background: #eaf3ed;
    border-radius: 4px; padding: 1.5px 6px; font-weight: 600;
  }
  .pill .d { width: 4px; height: 4px; border-radius: 50%; background: #3f7a5c; }

  /* 户名 */
  .who {
    display: flex; align-items: baseline; gap: 6px;
    margin-top: 7px; padding-bottom: 7px; border-bottom: 1px solid var(--rule);
  }
  .who .mail { font-size: 12.5px; font-weight: 650; letter-spacing: -.1px; }
  .who .ts { font-size: 11px; color: var(--muted); }
  .accts { display: flex; gap: 4px; margin-left: auto; }
  .a {
    font-size: 10.5px; padding: 1px 6px; border-radius: 3px;
    border: 1px solid var(--rule); color: var(--muted); font-weight: 600; letter-spacing: .2px;
  }
  .a.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* 金额 */
  .amount-row { display: flex; align-items: flex-end; gap: 10px; padding: 8px 0 7px; }
  .amount {
    font-size: 38px; font-weight: 800; letter-spacing: -1.6px; line-height: 1;
    display: flex; align-items: baseline;
  }
  .amount .cur { font-size: 20px; font-weight: 700; color: var(--ink-2); margin-right: 1px; }
  .amount .frac { font-size: 21px; color: var(--ink-2); font-weight: 700; letter-spacing: -.4px; }
  .amount-caption { padding-bottom: 4px; }
  .amount-caption .k { font-size: 11px; color: var(--muted); letter-spacing: .3px; }
  .amount-caption .paid { font-size: 11.5px; color: var(--ink-2); font-weight: 600; margin-top: 1px; }

  /* 明细行 */
  .rows { border-top: 1px solid var(--rule); }
  .r {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5.5px 0; border-bottom: 1px dotted #ded7ca; font-size: 12px;
  }
  .r:last-child { border-bottom: none; }
  .r .k { color: var(--muted); }
  .r .v { font-weight: 650; color: var(--ink); letter-spacing: -.1px; }
  .r .v.money { color: #2f6b52; }

  /* 存根 */
  .stub .cap {
    font-size: 10px; letter-spacing: 1px; color: var(--muted);
    text-transform: uppercase; font-weight: 700; text-align: center;
  }
  .stub .big {
    font-size: 26px; font-weight: 800; letter-spacing: -1px;
    text-align: center; margin-top: 2px;
  }
  .stub .big .u { font-size: 12px; font-weight: 700; color: var(--ink-2); letter-spacing: 0; }
  .stub .sub { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 1px; }
  .stub .hr { height: 1px; background: repeating-linear-gradient(90deg, #cfc6b8 0 4px, transparent 4px 8px); margin: 9px 0; }
  .stub .kv { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-bottom: 3px; }
  .stub .kv b { color: var(--ink-2); font-weight: 650; }
  .stub .spacer { flex: 1; }
  .pay {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    height: 27px; border-radius: 6px; background: var(--stamp); color: #fff;
    font-size: 11.5px; font-weight: 700; letter-spacing: .2px;
  }
  .pay-2 {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    height: 25px; margin-top: 5px; border-radius: 6px;
    background: transparent; border: 1px solid var(--rule); color: var(--ink-2);
    font-size: 11px; font-weight: 600;
  }
  svg { display: block; }
</style>
</head>
<body>
<div class="frame">

  <div class="card">
    <div class="main">
      <div class="head">
        <span class="brand">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.9-3.5 4.9-6 8.5-6 3.6 0 6.1 2.5 7 6-.9 3.5-3.4 6-7 6s-7.6-2.4-8.5-6Z"/><path d="M18 12v.5"/><path d="M7 10.7C7 8 5.6 6 2.7 5.5c-1 1.5-1 5 .5 6.5-1.5 1.5-1.5 5-.5 6.5C5.6 18 7 16 7 13.3z"/></svg>
          鱼鱼 API · 资产账单
        </span>
        <span class="spacer"></span>
        <span class="pill"><span class="d"></span>已连接</span>
      </div>

      <div class="who">
        <span class="mail">87850@qq.com</span>
        <span class="ts">17:42:08 同步</span>
        <span class="accts">
          <span class="a on">87</span>
          <span class="a">WL</span>
        </span>
      </div>

      <div class="amount-row">
        <div class="amount"><span class="cur">$</span>12<span class="frac">.34</span></div>
        <div class="amount-caption">
          <div class="k">可用余额</div>
          <div class="paid">累计充值 $48.00</div>
        </div>
      </div>

      <div class="rows">
        <div class="r"><span class="k">今日实扣</span><span class="v money">$0.4217</span></div>
        <div class="r"><span class="k">今日 Tokens</span><span class="v">1,284,000</span></div>
        <div class="r"><span class="k">本轮实扣</span><span class="v money">$0.0523 · 128.4K Tokens</span></div>
        <div class="r"><span class="k">凭据</span><span class="v">可自动续期 · 剩 6.2 小时</span></div>
      </div>
    </div>

    <div class="stub">
      <div class="cap">本次会话</div>
      <div class="big">2.4<span class="u">M</span></div>
      <div class="sub">Tokens</div>
      <div class="hr"></div>
      <div class="kv"><span>实扣</span><b>$0.3184</b></div>
      <div class="kv"><span>请求</span><b>6 次</b></div>
      <div class="kv"><span>模型</span><b>v4.1</b></div>
      <div class="spacer"></div>
      <div class="pay">充值</div>
      <div class="pay-2">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.8 9.8 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.7-2.7L3 16"/><path d="M8 16H3v5"/></svg>
        同步
      </div>
    </div>
  </div>

  <div class="widget">
    <img src="../../assets/DSniang1.png" alt="小鲸鱼">
    <div class="menu">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </div>
  </div>

</div>
</body>
</html>
